<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance - Portfolio John Gotzelmann</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f1026;--text:#f8f9fa;--text2:#b9bfd4;--accent:#7aa2ff}
    *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
    body{background:radial-gradient(1200px 800px at 50% -10%,rgba(122,162,255,0.14),transparent),var(--bg);color:var(--text);line-height:1.8;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
    .card{border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:clamp(2rem,5vw,4rem);backdrop-filter:blur(12px);background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent)}
    h1{font-family:Jost,Inter,sans-serif;font-size:clamp(2rem,6vw,3.8rem);margin-bottom:1rem}
    p{color:var(--text2);max-width:600px}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 10px rgba(122,162,255,0.12);margin-bottom:1.5rem;animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(122,162,255,0.4)}70%{box-shadow:0 0 0 14px rgba(122,162,255,0)}100%{box-shadow:0 0 0 0 rgba(122,162,255,0)}}
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Site en maintenance</h1>
    <p>Mise à jour en cours. Je nettoie et améliore le portfolio. Retour très bientôt.</p>
  </div>
</body>
</html>
